<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalMart — Login</title>

  <link rel="stylesheet" href="/LocalMart/view/css/login.css?v=2">
</head>
<body>
  <div class="bg">
    <div class="noise"></div>
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="auth">
    <!-- Left image / promo panel -->
    <section class="auth-left" aria-label="Login banner">
      <div class="left-overlay"></div>

      <div class="left-content">
        <div class="brand">
          <img src="/LocalMart/view/image/logo.png" alt="LocalMart Logo" />
          <span>LocalMart</span>
        </div>

        <h1>Welcome back.</h1>
        <p>
          Sign in to browse deals, manage listings, and keep your cart ready to go.
        </p>

        <div class="chips">
          <span class="chip">Secure</span>
          <span class="chip">Fast</span>
          <span class="chip">Buyer & Seller</span>
        </div>
      </div>
    </section>

    <!-- Right form panel -->
    <section class="auth-right" aria-label="Login form">
      <div class="card" id="tiltCard">
        <div class="card-head">
          <h2>Sign in</h2>
          <p class="muted">Enter your details to continue.</p>
        </div>

        <form id="loginForm" action="/LocalMart/controllers/login.php" method="POST" novalidate>
          <label class="field">
            <span class="label">Email</span>
            <div class="control">
              <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required />
              <span class="icon">✉️</span>
            </div>
          </label>

          <label class="field">
            <span class="label">Password</span>
            <div class="control">
              <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="icon-btn" id="togglePass" aria-label="Show password">👁️</button>
            </div>
          </label>

          <label class="field">
            <span class="label">Role</span>
            <div class="control">
              <select name="role" id="role" required>
                <option value="" selected disabled>Select your role</option>
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
                <option value="admin">Admin</option>
              </select>
              <span class="icon">🧩</span>
            </div>
          </label>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" />
              <span>Remember me</span>
            </label>

            <a class="link" href="/LocalMart/view/html/register.html">Create account</a>
          </div>

          <div class="loginLinksRow">
            <a class="forgotBtn" href="/LocalMart/view/html/reset_password.html">
              <span class="forgotIcon">🔒</span>
              Forgot password?
            </a>
          </div>                            

          <button class="btn" type="submit" data-ripple="true">
            Login <span class="arrow">→</span>
          </button>

          <p id="msg" class="msg" aria-live="polite"></p>

          <div class="bottom">
            <a class="link muted-link" href="/LocalMart/view/html/welcome.html">← Back to Welcome</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>

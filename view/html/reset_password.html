<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | LocalMart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/LocalMart/view/css/reset_password.css" />
</head>
<body>

<header class="topbar">
  <a href="/LocalMart/view/html/login.html" class="backBtn">← Back to Login</a>
  <div class="title">Reset Password</div>
  <div style="width:130px;"></div>
</header>

<main class="container">
  <section class="card">
    <div class="cardHeader">
      <h1>Reset your password</h1>
      <p>Enter your account email and choose a new password.</p>
    </div>

    <form id="resetForm" class="form">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="example@email.com" required />
        <div class="hint" id="emailHint"></div>
      </div>

      <div class="field">
        <label>New Password</label>
        <input id="newPass" type="password" placeholder="At least 6 characters" required />
        <div class="hint" id="passHint"></div>
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <input id="confirmPass" type="password" placeholder="Confirm password" required />
      </div>

      <button class="btn primary" type="submit" id="submitBtn">Reset Password</button>

      <div class="note">
        Tip: Use something you won’t forget (but don’t reuse old passwords).
      </div>
    </form>
  </section>
</main>

<div class="toast" id="toast">Password updated ✅</div>

<script src="/LocalMart/view/js/reset_password.js"></script>
</body>
</html>
